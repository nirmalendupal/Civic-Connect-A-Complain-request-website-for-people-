<!doctype html>
<html>
  <head>
    <title>Login - CivicConnect</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;

        /* 🌟 Yeh animation line yahan jodni hai */
        animation: fadeInUp 0.6s ease-out;
      }
      h2 {
        color: #333;
        margin-bottom: 30px;
      }
      .form-group {
        margin: 20px 0;
        text-align: left;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        font-size: 14px;
      }
      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        transition: border-color 0.3s;
        font-family: Arial, sans-serif;
      }
      .form-group input:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }
      .errorlist {
        color: #dc2626;
        list-style: none;
        padding: 0;
        margin: 5px 0;
        font-size: 13px;
      }
      .errorlist li {
        margin: 5px 0;
      }
      button {
        background: #4f46e5;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 5px;
        width: 100%;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        margin-top: 20px;
        transition: background 0.3s;
      }
      button:hover {
        background: #4338ca;
      }
      .signup-link {
        margin-top: 20px;
        color: #666;
      }
      .signup-link a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
      }
      .signup-link a:hover {
        text-decoration: underline;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login to CivicConnect</h2>
      <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
          {{ field.label_tag }} {{ field }} {% if field.errors %}
          <ul class="errorlist">
            {% for error in field.errors %}
            <li>{{ error }}</li>
            {% endfor %}
          </ul>
          {% endif %}
        </div>
        {% endfor %}

        <button type="submit">Login</button>
      </form>
      <p class="signup-link">
        Don't have an account? <a href="{% url 'signup' %}">Sign Up here</a>
      </p>
    </div>
  </body>
</html>
